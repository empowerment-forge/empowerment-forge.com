<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | The Empowerment Forge</title>
    <meta name="robots" content="noindex, follow" />
    <link
      rel="icon"
      type="image/png"
      href="/images/logo-anvil-transparent.png"
    />
    <meta name="theme-color" content="#2e2c33" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        min-height: 100vh;
        margin: 0;
        align-items: center;
        justify-content: center;
        background: #2e2c33;
        color: #ffffff;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      main {
        width: min(100% - 3rem, 620px);
        padding: 2rem 0;
        text-align: center;
      }

      img {
        width: clamp(140px, 30vw, 220px);
        height: auto;
        margin-bottom: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.75rem);
      }

      p {
        margin: 1rem 0 0;
        color: #dedee2;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      a {
        color: #ffffff;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 4px;
        border-radius: 2px;
      }
    </style>
  </head>

  <body>
    <main>
      <img
        src="/images/logo-anvil-transparent.png"
        alt=""
        width="620"
        height="646"
      />
      <h1>Page Not Found</h1>
      <p>
        The page you requested does not exist.
        <a href="/">Return to The Empowerment Forge homepage</a>.
      </p>
    </main>
  </body>
</html>
